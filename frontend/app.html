<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Surfing the Frequencies — a free lifelong learning platform for every human on earth"/>
<meta name="theme-color" content="#080C14"/>
<title>Surfing the Frequencies</title>

<!-- Favicon — inline SVG wave, no separate file needed -->
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>

<!-- PWA — installable app shell (added 2026-08-19). manifest.json + icons/
     live in frontend/; sw.js registered below. See sw.js's own header
     comment for caching strategy and how CACHE_NAME versioning ties into
     scripts/bump_asset_versions.sh. -->
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

<!-- Styles -->
<!-- Cache-busting: bump ASSET_VERSION below on every deploy that touches
     app.css/app.js. Without it, browsers can hold a long-lived cached copy
     of these files and a plain reload won't fetch the new version — only a
     hard-refresh or incognito window would show the change (confirmed
     2026-07-19, P12 follow-up). Query-string versioning forces a fresh
     fetch on any version bump regardless of nginx cache headers. -->
<link rel="stylesheet" href="app.css?v=609255717">
</head>
<body>

<!-- ============================================================
     Surfing the Frequencies — build.onehouse.top

     Platform architecture:
       index.html  — shell (this file)
       app.css     — styles (external, cached separately)
       app.js      — logic  (external, cached separately)

     Portals:
       /           — Learner portal (Agora, Academy, Mouseion, Peripatos)
       /org        — Organization portal
       /contribute — Community LECKO contribution
       /admin      — Admin portal
       /polis      — The Polis (referenda, bioregions, civic)

     Backend:
       FastAPI on port 8000 (proxied via nginx at /api/*)
       MariaDB — schema in /var/www/freqlearn/schema.sql

     To update: edit app.js or app.css and upload, then bump ASSET_VERSION
     (the ?v=... query string on both tags below) so browsers don't serve a
     stale cached copy on a plain reload — see P12 follow-up, 2026-07-19.
     No build step required — nginx serves static files directly.

     i18n (2026-07-21): translated strings live in lang/<code>.json (one file
     per language, en/fr/es/vi/zh/ar/de/ru), fetched lazily by app.js only
     when a learner's UI language isn't English — see ensureLanguageLoaded()
     in app.js. If you edit any file under lang/, bump LANG_ASSET_VERSION at
     the top of app.js (separate from ASSET_VERSION here, since app.html
     never references the lang/ files directly).
============================================================ -->

<div id="root"></div>

<script src="app.js?v=90457374"></script>

<!-- Service worker registration — see sw.js header comment for strategy.
     Kept as a tiny inline script (not folded into app.js) so it registers
     even if app.js itself ever fails to parse/execute. Dispatches a
     'lmbok:sw-update-ready' event on the new-version-waiting case; app.js
     listens for it to show the non-disruptive "update available" banner
     rather than force-reloading mid-session (2026-08-19 decision — see
     PROJECT.md). -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var installing = reg.installing;
        if (!installing) return;
        installing.addEventListener('statechange', function () {
          // navigator.serviceWorker.controller only exists once a worker has
          // already taken control on a prior visit -- that's what
          // distinguishes "an update is available" from "this is the very
          // first install," which needs no banner at all.
          if (installing.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner(reg);
          }
        });
      });
    }).catch(function (err) {
      console.warn('LMBoK service worker registration failed:', err);
    });

    // Once the new worker activates (after the banner's Refresh is
    // clicked), reload once to pick up the fresh assets it now controls.
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}

// Small, self-contained banner -- deliberately not routed through app.js's
// own render pipeline (which uses a state-driven pattern specifically to
// avoid modal re-renders wiping DOM patches, per P40) so a service-worker
// update can never collide with it. Silent-but-non-disruptive by design:
// LMBoK's userbase is often on flaky connections, so nothing here forces
// a reload mid-session -- it just offers one.
function showUpdateBanner(reg) {
  if (document.getElementById('lmbok-sw-update-banner')) return;
  var bar = document.createElement('div');
  bar.id = 'lmbok-sw-update-banner';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
    'background:#0D1220;color:#E8EDF8;border-top:1px solid rgba(255,255,255,0.12);' +
    'font-family:"DM Sans",sans-serif;font-size:13px;padding:12px 16px;' +
    'display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;' +
    'box-shadow:0 -4px 20px rgba(0,0,0,0.3);';
  bar.innerHTML =
    '<span>A new version of LMBoK is ready.</span>' +
    '<button type="button" id="lmbok-sw-update-btn" style="background:#00E5C8;color:#080C14;' +
    'border:none;border-radius:7px;padding:7px 16px;font-weight:700;cursor:pointer;font-size:13px;">Refresh</button>' +
    '<button type="button" id="lmbok-sw-update-dismiss" style="background:transparent;color:#8B96B8;' +
    'border:none;cursor:pointer;font-size:13px;text-decoration:underline;">Later</button>';
  document.body.appendChild(bar);

  document.getElementById('lmbok-sw-update-btn').addEventListener('click', function () {
    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  });
  document.getElementById('lmbok-sw-update-dismiss').addEventListener('click', function () {
    bar.remove();
  });
}
</script>

</body>
</html>
